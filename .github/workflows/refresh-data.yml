name: Atualizar JSONs públicos

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-static-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependência da exportação
        run: python -m pip install 'requests>=2.31,<3'
      - name: Recriar JSONs públicos
        run: python scripts/export_static_data.py
      - name: Publicar dados atualizados no repositório
        run: |
          git add public/dados/v1
          if git diff --cached --quiet; then
            echo 'Nenhuma mudança nos JSONs.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Atualizar dados legislativos estáticos'
          git push
